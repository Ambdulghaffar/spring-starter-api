app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:no-reply@rifline.ambdulghaffar.com}

ai:
  default-provider: groq
  providers:
    groq:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      model: openai/gpt-oss-120b
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      model: gemini-3.6-flash

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  root-folder: ${CLOUDINARY_ROOT_FOLDER}

media:
  orphan-retention: ${MEDIA_ORPHAN_RETENTION:7d}
  orphan-purge-cron: "${MEDIA_ORPHAN_PURGE_CRON:0 0 3 * * *}"

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ${SERVER_NAME:kickstart-springboot}
  ai:
    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      chat:
        model: openai/gpt-oss-120b
#      base-url: https://generativelanguage.googleapis.com/v1beta/openai
#      api-key: ${GEMINI_API_KEY}
#      chat:
#        model: gemini-3.6-flash
  profiles:
    active:
      - ${ENV}
      - ${AUTH_PROVIDER:session}

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

#   email service : Brevo
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  session:
    jdbc:
      initialize-schema: never
    timeout: ${SESSION_TIMEOUT:30m}

  web:
    error:
      include-message: always
      include-stacktrace: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.ambdulghaffar.springbootstarterkit: INFO

---
spring:
  config:
    activate:
      on-profile: jwt

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  refresh-token-reuse-grace-period: ${JWT_REFRESH_REUSE_GRACE_PERIOD:30000}

---
spring:
  config:
    activate:
      on-profile: keycloak

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false

  session:
    jdbc:
      initialize-schema: always

  web:
    error:
      include-message: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.ambdulghaffar.springbootstarterkit: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE